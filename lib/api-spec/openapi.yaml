openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feedback
    description: Event participant feedback submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit event feedback
      description: Saves a participant's post-event feedback and follow-up preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSubmission"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to save feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FeedbackInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: ["string", "null"]
          maxLength: 40
        organization:
          type: ["string", "null"]
          maxLength: 120
        overallRating:
          type: integer
          minimum: 1
          maximum: 5
        mostValuable:
          type: ["string", "null"]
          maxLength: 2000
        improvements:
          type: ["string", "null"]
          maxLength: 2000
        futureTopics:
          type: ["string", "null"]
          maxLength: 2000
        contactRequested:
          type: boolean
        futureUpdates:
          type: boolean
      required:
        - fullName
        - email
        - overallRating
        - contactRequested
        - futureUpdates
    FeedbackSubmission:
      type: object
      properties:
        id:
          type: integer
        submittedAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - id
        - submittedAt
        - message
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

